version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: employee_assessment_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: employee_assessment_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:alpine
    container_name: employee_assessment_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: employee_assessment_ai
    restart: always
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=postgresql://postgres:password123@postgres:5432/employee_assessment_db
      - PORT=8001
      - HOST=0.0.0.0
    ports:
      - "8001:8001"
    depends_on:
      - postgres

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: employee_assessment_backend
    restart: always
    environment:
      - PORT=4000
      - DATABASE_URL=postgresql://postgres:password123@postgres:5432/employee_assessment_db
      - JWT_SECRET=super_secret_employee_assessment_jwt_key_2026_xyz
      - AI_SERVICE_URL=http://ai-service:8001
      - REDIS_URL=redis://redis:6379
    ports:
      - "4000:4000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - postgres
      - redis
      - ai-service

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: employee_assessment_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  uploads_data:

